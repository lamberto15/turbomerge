name: Changeset

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    # skipped for the version PR, Dependabot and PRs labelled no-changeset (docs, CI, tests)
    if: >-
      github.head_ref != format('changeset-release/{0}', github.base_ref) &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'no-changeset')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: PR includes a changeset
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec changeset status --since="origin/$BASE_REF"
